; Worker untuk queue 'whatsapp' - notifikasi WA (KirimNotifikasiWhatsapp).
; --tries=3 --timeout=30 WAJIB konsisten dengan $tries/$timeout di
; app/Jobs/KirimNotifikasiWhatsapp.php (lihat komentar di file tsb).
; --sleep=3: jeda antar polling job baru saat queue kosong, supaya tidak
; membebani DB (QUEUE_CONNECTION=redis di .env, jadi ini polling ke Redis).
[program:perpustakaan-whatsapp-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /home/zulfikriyahya/blueprint/perpustakaan/artisan queue:work redis --queue=whatsapp --tries=3 --timeout=30 --sleep=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=zulfikriyahya
numprocs=1
redirect_stderr=true
stdout_logfile=/home/zulfikriyahya/blueprint/perpustakaan/storage/logs/worker-whatsapp.log
stopwaitsecs=35

; Worker untuk queue 'default' - job lain di luar WA (belum ada saat ini,
; disiapkan sebagai fondasi supaya tidak perlu ubah supervisor config lagi
; setiap kali ada job baru yang tidak eksplisit ->onQueue()).
[program:perpustakaan-default-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /home/zulfikriyahya/blueprint/perpustakaan/artisan queue:work redis --queue=default --tries=3 --timeout=60 --sleep=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=zulfikriyahya
numprocs=1
redirect_stderr=true
stdout_logfile=/home/zulfikriyahya/blueprint/perpustakaan/storage/logs/worker-default.log
stopwaitsecs=65


---

# crontab -e
* * * * * cd /home/zulfikriyahya/blueprint/perpustakaan && php artisan schedule:run >> /dev/null 2>&1

---

sudo cp deploy/supervisor/perpustakaan-worker.conf /etc/supervisor/conf.d/
sudo supervisorctl reread
sudo supervisorctl update
sudo supervisorctl start perpustakaan-whatsapp-worker:*
sudo supervisorctl start perpustakaan-default-worker:*
